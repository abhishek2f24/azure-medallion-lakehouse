name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check processing/ ingestion/ governance/ data_quality/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyspark==3.5.0 delta-spark==3.0.0 pytest pytest-cov
      - run: pytest tests/ -v --cov=processing --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  dbt-compile:
    name: dbt Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-databricks==1.8.*
      - run: cd dbt && dbt compile --target ci --profiles-dir .
      - run: cd dbt && dbt parse --target ci --profiles-dir .

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - run: cd terraform && terraform init -backend=false
      - run: cd terraform && terraform validate
      - run: cd terraform && terraform fmt -check -recursive

  deploy:
    name: Deploy (main only)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, dbt-compile, terraform-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Terraform Apply
        run: |
          cd terraform
          terraform init
          terraform apply -var-file=prod.tfvars -auto-approve
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      - name: Run dbt Production
        run: |
          cd dbt
          dbt run --target prod --select state:modified+
          dbt test --target prod --select state:modified+
          dbt docs generate --target prod
        env:
          DBT_DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DBT_DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBT_HTTP_PATH:        ${{ secrets.DATABRICKS_HTTP_PATH }}
